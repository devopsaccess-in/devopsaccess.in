---
# ===========================================================================
# app_dashboard — deploys the Next.js dashboard (standalone output) as a
# hardened systemd node service on localhost:3001. CI builds the standalone
# tree (with .next/static copied in) and rsyncs it here; node comes from
# NodeSource (Ubuntu 24.04's archive node is too old for Next 16).
# ===========================================================================

- name: Assert required dashboard secrets are provided
  ansible.builtin.assert:
    that:
      - auth0_domain is defined and auth0_domain | length > 0
      - auth0_client_id is defined and auth0_client_id | length > 0
      - auth0_client_secret is defined and auth0_client_secret | length > 0
      - auth0_session_secret is defined and auth0_session_secret | length > 0
    fail_msg: >-
      auth0_domain, auth0_client_id, auth0_client_secret and
      auth0_session_secret must be supplied (via CI secrets / --extra-vars).

- name: Ensure the built dashboard standalone tree exists on the control node
  ansible.builtin.stat:
    path: "{{ dashboard_dist_local }}"
  delegate_to: localhost
  become: false
  register: dashboard_dist

- name: Fail clearly if the dashboard was not built
  ansible.builtin.fail:
    msg: >-
      {{ dashboard_dist_local }} not found. Build apps/dashboard and copy
      .next/standalone (with .next/static inside) there first — see
      .github/workflows/deploy-app.yml.
  when: not (dashboard_dist.stat.exists and dashboard_dist.stat.isdir)

# --- Node runtime -----------------------------------------------------------
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ dashboard_node_major }}.x nodistro main"
    filename: nodesource
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# --- Service user + files ---------------------------------------------------
- name: Create dashboard system group
  ansible.builtin.group:
    name: dashboard
    system: true

- name: Create dashboard system user
  ansible.builtin.user:
    name: dashboard
    group: dashboard
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create /opt/dashboard
  ansible.builtin.file:
    path: /opt/dashboard
    state: directory
    owner: "{{ deploy_user }}"
    group: dashboard
    mode: "0750"

- name: Synchronize dashboard standalone tree
  ansible.posix.synchronize:
    src: "{{ dashboard_dist_local }}/"
    dest: /opt/dashboard/
    delete: true
    recursive: true
    rsync_opts:
      - "--chmod=D750,F640"
  notify: Restart dashboard

- name: Ensure group ownership of the dashboard tree
  ansible.builtin.file:
    path: /opt/dashboard
    owner: "{{ deploy_user }}"
    group: dashboard
    recurse: true

# Next writes its fetch/ISR cache under .next/cache next to server.js — the
# only path the service needs write access to.
- name: Ensure Next cache directory is writable by the service
  ansible.builtin.file:
    path: "/opt/dashboard/{{ dashboard_server_rel | dirname }}/.next/cache"
    state: directory
    owner: dashboard
    group: dashboard
    mode: "0750"
  notify: Restart dashboard

- name: Install dashboard environment file
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: /opt/dashboard/dashboard.env
    owner: dashboard
    group: dashboard
    mode: "0600"
  no_log: true
  notify: Restart dashboard

- name: Install dashboard systemd unit
  ansible.builtin.template:
    src: dashboard.service.j2
    dest: /etc/systemd/system/dashboard.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart dashboard

- name: Enable and start dashboard service
  ansible.builtin.systemd_service:
    name: dashboard
    enabled: true
    state: started
    daemon_reload: true
