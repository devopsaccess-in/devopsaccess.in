apiVersion: 1

groups:
  - orgId: 1
    name: devopsaccess
    folder: Alerts
    interval: 1m
    rules:
      # Fire when the nginx 5xx rate stays above 1 req/s for 5 minutes.
      - uid: nginx_5xx_rate
        title: High 5xx error rate
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "nginx 5xx rate is high (> 1 req/s for 5m)"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(rate(nginx_http_response_count_total{status=~"5.."}[5m]))
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]

      # Fire when node_exporter stops reporting for 2 minutes (host/exporter down).
      - uid: node_down
        title: Node exporter down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: "node_exporter is not reporting — host or exporter is down"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="node"}
              instant: false
              range: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
