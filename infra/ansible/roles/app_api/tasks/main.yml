---
# ===========================================================================
# app_api — deploys the Go uptime control-plane API as a hardened systemd
# service bound to localhost. nginx reverse-proxies /api/ on the
# app.devopsaccess.in vhost to it. The binary is cross-compiled in CI
# (GOOS=linux GOARCH=amd64) and copied here; Go is never installed on the box.
# Migrations run at service startup, connecting as uptime_api (see the
# postgres role for the DB + roles).
# ===========================================================================

- name: Assert required uptime API secrets are provided
  ansible.builtin.assert:
    that:
      - uptime_db_password is defined and uptime_db_password | length > 0
      - auth0_domain is defined and auth0_domain | length > 0
    fail_msg: "uptime_db_password and auth0_domain must be supplied (via CI secrets / --extra-vars)."

- name: Ensure the pre-built uptime-api binary exists on the control node
  ansible.builtin.stat:
    path: "{{ api_binary_src }}"
  delegate_to: localhost
  become: false
  register: api_bin

- name: Fail clearly if the binary was not built
  ansible.builtin.fail:
    msg: >-
      {{ api_binary_src }} not found. Build it first:
      GOOS=linux GOARCH=amd64 go build -o infra/ansible/roles/app_api/files/uptime-api ./services/api
  when: not api_bin.stat.exists

- name: Create uptime-api system group
  ansible.builtin.group:
    name: uptime-api
    system: true

- name: Create uptime-api system user
  ansible.builtin.user:
    name: uptime-api
    group: uptime-api
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create /opt/uptime-api
  ansible.builtin.file:
    path: /opt/uptime-api
    state: directory
    owner: root
    group: uptime-api
    mode: "0750"

- name: Install uptime-api binary
  ansible.builtin.copy:
    src: "{{ api_binary_src }}"
    dest: /opt/uptime-api/uptime-api
    owner: root
    group: uptime-api
    mode: "0755"
  notify: Restart uptime-api

- name: Install uptime-api environment file
  ansible.builtin.template:
    src: uptime-api.env.j2
    dest: /opt/uptime-api/uptime-api.env
    owner: uptime-api
    group: uptime-api
    mode: "0600"
  no_log: true
  notify: Restart uptime-api

- name: Install uptime-api systemd unit
  ansible.builtin.template:
    src: uptime-api.service.j2
    dest: /etc/systemd/system/uptime-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart uptime-api

- name: Enable and start uptime-api service
  ansible.builtin.systemd_service:
    name: uptime-api
    enabled: true
    state: started
    daemon_reload: true
