---
# Alert sender via the local Postfix relay.
# Must be a real Workspace mailbox — see the app_api role for why.
alert_from: "support@devopsaccess.in"
scheduler_workers: 20

# Uptime DB connection — connects as uptime_scheduler (BYPASSRLS, see the
# postgres role); uptime_db_password comes from the UPTIME_DB_PASSWORD secret.
uptime_db_name: uptime
uptime_scheduler_db_user: uptime_scheduler

# Path to the pre-built linux/amd64 binary on the control node (built in CI).
scheduler_binary_src: "{{ playbook_dir }}/roles/app_scheduler/files/uptime-scheduler"
