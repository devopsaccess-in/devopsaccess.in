---
# Where the contact service listens (localhost only; nginx proxies /api/ to it).
contact_listen_addr: "127.0.0.1:8080"
contact_proxy_port: 8080

# SMTP relay (Google Workspace). smtp_user / smtp_pass come from CI secrets and
# have no default — the role asserts they are provided.
smtp_host: "smtp.gmail.com"
smtp_port: "587"
contact_to: "support@devopsaccess.in"
contact_allowed_origin: "https://devopsaccess.in"

# Postgres connection (see the postgres role). db_password comes from a CI secret.
# DATABASE_URL is composed in the env template. razorpay_webhook_secret is
# optional — empty disables the payments webhook endpoint.
db_name: devopsaccess
db_user: app
razorpay_webhook_secret: ""
turnstile_secret: ""

# Path to the pre-built linux/amd64 binary on the control node (built in CI).
contact_binary_src: "{{ playbook_dir }}/roles/contact_api/files/contact"
